<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>iPhone 17 Pro — 3D</title>
<style>
  html,body{margin:0;height:100%;background:#e9e7e2}
  three-d-stage:not(:defined){visibility:hidden}
  three-d-stage{display:block;width:100vw;height:100vh}
</style>
</head>
<body>
<three-d-stage name="iphone-17-pro" background="#e9e7e2" autorotate></three-d-stage>
<script src="./three-d-stage.js"></script>
<script type="module">
import { buildPhone } from './phone-model.js';
const stage = document.querySelector('three-d-stage');
const { THREE } = await stage.ready;
const phone = await buildPhone(THREE, './assets/screen.png');
phone.rotation.x = -0.02;
stage.setObject(phone);
</script>
</body>
</html>
